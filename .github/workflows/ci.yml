name: ROS 2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            libopencv-dev python3-colcon-common-extensions

      - name: Test perception environment checker
        shell: bash
        run: |
          python3 -m unittest src/perception/test/test_check_perception_environment.py
          python3 src/perception/scripts/check_perception_environment.py --help

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select \
            dog_patrol_interfaces dog_patrol_perception_interfaces \
            dog_patrol_manager \
            dog_patrol_perception_orchestrator \
            dog_patrol_perception_voice \
            dog_patrol_perception_tracking \
            --cmake-args -DTRACKING_ENABLE_ORIN_RUNTIME=OFF

      - name: Check installed voice deployment artifacts
        shell: bash
        run: |
          test -x install/dog_patrol_perception_voice/lib/dog_patrol_perception_voice/perception_voice_provider
          test -x install/dog_patrol_perception_voice/lib/dog_patrol_perception_voice/perception_voice_readiness
          test -x install/dog_patrol_perception_voice/lib/dog_patrol_perception_voice/perception_voice_acceptance
          test -f install/dog_patrol_perception_voice/share/dog_patrol_perception_voice/launch/voice.launch.py
          test "$(sha256sum install/dog_patrol_perception_voice/lib/python*/site-packages/dog_patrol_perception_voice/assets/r818_pcm_base64_aarch64 | awk '{print $1}')" = "c2517d85e60845679acaeab4aa6c4f439b828393c5d73599dcef0e4fa68c0f52"
          source install/setup.bash
          ros2 run dog_patrol_perception_voice perception_voice_acceptance --help

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select \
            dog_patrol_interfaces dog_patrol_perception_interfaces \
            dog_patrol_manager \
            dog_patrol_perception_orchestrator \
            dog_patrol_perception_voice \
            dog_patrol_perception_tracking \
            --event-handlers console_direct+
          colcon test-result --verbose
