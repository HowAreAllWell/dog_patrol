# perception_reid 参数（launch 默认加载；运行时可用 ros2 param set 修改）
/perception_reid:
  ros__parameters:
    # ---- 接口 ----
    service_name: /perception/reid/dedup
    status_topic: /perception/reid/status
    handled_topic: /perception/reid/handled   # 任务侧 handled 结论下发（gate 转发）
    cloud_request_topic: /reid/cloud/request
    cloud_response_topic: /reid/cloud/response
    cloud_qos_depth: 200          # 负责人接口约定 3.5

    # ---- 云端交互 ----
    cloud.enable: false           # 当前阶段（检测对接期）关闭；代理部署后改 true
                                   # 关闭时未命中立即返回"新人"，不等待云端
    cloud.timeout_ms: 3000        # 未命中时等待云端响应上限
    cloud.grace_sec: 60.0         # 超时后迟到响应仍可绑定全局身份的窗口
    cloud.apply_library_updates: true  # false = 不接收云端扇出库更新
    cloud.max_results: 3
    library_update_topic: /reid/cloud/library_update   # 扇出订阅（我们的扩展接口）
    device_id: "m20-001"          # 多狗部署时每台必须唯一！
    api_version: "1.0"
    model_name: "clipreid_vitb16_after"   # 云端按此+版本做兼容校验，全狗队必须一致
    model_version: "1.0.0"
    data_dir: /data/reid          # 缩略图+embedding 载荷目录（云端代理与本机共用路径约定）

    # ---- 模型 ----
    model_path: ""                # 必填。device=tensorrt 时指向 .engine（scripts/build_trt_engine.sh 生成）；
                                  #   device=cuda/cpu 时指向 ONNX
    device: cuda                  # tensorrt（推荐，Orin 上 FP16 约 2~6ms）| cuda | cpu（OpenCV DNN 后端）
    input_height: 256
    input_width: 128

    # ---- 端侧库 ----
    threshold: 0.70               # 身份命中余弦阈值（ViT-B/16 after 标定）
    track_assoc_threshold: 0.50   # 同 track 兜底关联阈值（防 track 裂化）
    max_identities: 10000
    track_ttl_sec: 300.0          # track 映射有效期
    handled_ignore_seconds: 86400.0  # 平台"重复核验忽略时长"：核验通过后从该时刻
                                     #   起该秒数内同人免重复核验，到期重新完整
                                     #   核验；资格跨天持续（凌晨清库仅保留仍在
                                     #   忽略期内的标记，不提前到期）；0=关闭；
                                     #   重启服务生效；跨重启按墙钟精确倒计时
                                     #  （停机期间照常计入）。检测侧经 handled_
                                     #   until 固定截止自动跟随，无需重复配置。
    update_min_delta: 0.01        # 模板移动小于该值不回推云端（防抖）
    min_det_conf: 0.0             # 检测置信度下限（0=不启用，质量把关交检测侧）

    # ---- 当日库持久化 ----
    persist.enable: true            # 重启/开关机后从 data_dir/library.bin 恢复当日库；
                                    #   跨天文件自动作废（每日清零语义不变）；
                                    #   模型/版本不符或损坏的文件不加载（从空库开始）
    persist.save_interval_sec: 10.0 # 防抖落盘间隔；异常断电最多丢该窗口内的更新，
                                    #   正常退出时兜底落盘一次

    # ---- 载荷 ----
    thumb_width: 96               # 96x192 webp q60 约 3~4KB；1280 维 float32=5120B
    thumb_height: 192             # 两者合计 < 10240B（接口约定 3.3）
    thumb_quality: 60

    # ---- 模型驻留 ----
    model_idle_unload_sec: 0.0    # 0=常驻（推荐：启动即预加载，巡逻全日问询，
                                  #   卸载再加载只会让空闲后的第一人多等）；
                                  #   >0 = 空闲 N 秒后卸载（内存/显存紧张时用）
