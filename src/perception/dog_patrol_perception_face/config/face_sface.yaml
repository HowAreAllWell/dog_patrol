# Legacy SFace fallback. Production uses face.yaml (MobileFaceNet).
detector_engine: ""
recognition_engine: ""
recognition_model: sface
recognition_embedding_dim: 128
alignment_profile: legacy_sface
whitelist_dir: ""

detector_conf_thres: 0.25
detector_iou_thres: 0.5
similarity_threshold: 0.55
size_sigma: 20.0
size_weighting_enabled: true
temporal_window: 10
min_frames_for_decision: 5
window_timeout_seconds: 3.0
crop_freshness_timeout_seconds: 1.0
overlay_inference_hz: 10.0
face_min_score: 0.4
face_min_box_ratio: 0.01
stop_after_matched: true
matched_hold_seconds: 5.0
