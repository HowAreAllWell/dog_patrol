# MobileFaceNet production defaults. The model, ArcFace alignment and 512
# dimensional embedding contract are fixed in code.
detector_engine: ""
recognition_engine: ""
whitelist_dir: ""

detector_conf_thres: 0.25
detector_iou_thres: 0.5

similarity_threshold: 0.3274939358
size_sigma: 20.0
size_weighting_enabled: false
temporal_window: 10
min_frames_for_decision: 5

window_timeout_seconds: 3.0
# Platform patrol-subtask settings. Zero falls back to the legacy value above.
# Face remains active for the whole voice wait during each joint round.
initial_face_window_seconds: 3.0
dual_verification_window_seconds: 10.0
crop_freshness_timeout_seconds: 1.0

# Image evidence is the unmodified tracking crop received by this node.
evidence_photo_enabled: true
evidence_photo_root: "/data/dog_patrol/photos/face"
evidence_photo_format: "jpg"
evidence_photo_jpeg_quality: 90
evidence_photo_retention_seconds: 604800
evidence_photo_max_files: 10000

# Overlay inference budget: cap the per-crop inference rate so the face model
# never saturates the shared GPU (measured: full-rate peaks ~98%, capped at
# 10 Hz the average delta is ~6%). Quality filter skips low-confidence/small
# faces so recognition only runs on usable crops.
overlay_inference_hz: 10.0
face_min_score: 0.4
face_min_box_ratio: 0.01
stop_after_matched: true
matched_hold_seconds: 5.0
