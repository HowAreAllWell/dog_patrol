seed: 3047
models:
  separate: false
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
    - name: net
      input: STATES
      layers:
      - 32
      - 32
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: STATES
      layers:
      - 32
      - 32
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 3
  learning_epochs: 2
  mini_batches: 2
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0003
  learning_rate_scheduler: null
  random_timesteps: 0
  learning_starts: 0
  ratio_clip: 0.2
  value_clip: 0.0
  clip_predicted_values: false
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  grad_norm_clip: 0.5
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: false
  experiment:
    directory: /fast_data/zhangziyang/workspace/RL2Path/logs/skrl/rl2path_direct
    experiment_name: 2025-08-21_11-49-36_ppo_torch
    write_interval: auto
    checkpoint_interval: 200
trainer:
  class: SequentialTrainer
  timesteps: 8000
  environment_info: log
  close_environment_at_exit: false
