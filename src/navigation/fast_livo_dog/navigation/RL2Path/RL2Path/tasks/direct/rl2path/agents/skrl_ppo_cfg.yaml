# -----------------------------  SB3 → skrl 迁移后配置  -----------------------------
seed: 3047

# ───────────────────────────── Models ─────────────────────────────
models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [32, 32]          # 若 SB3 的 policy_kwargs 用了别的层数，这里同步即可
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [32, 32]
        activations: elu
    output: ONE

# ───────────────────────────── Memory ─────────────────────────────
memory:
  class: RandomMemory
  memory_size: -1                # 自动根据 rollouts × num_envs 计算

# ───────────────────────────── Agent (PPO) ─────────────────────────────
agent:
  class: PPO
  # —— 采样与优化 —— #
  rollouts: 2048                 # = SB3 n_steps
  learning_epochs: 10            # = SB3 n_epochs
  mini_batches: 6144             # 2048×1024 ÷ 2048 = 2 048 条/批，与 SB3 batch_size 对齐
                                 # 如改 --num_envs，记得用 rollouts*num_envs/2048 重新算
  # —— 折扣与 GAE —— #
  discount_factor: 0.99
  lambda: 0.95
  # —— 学习率 —— #
  learning_rate: 1.0e-04         # SB3 默认
  learning_rate_scheduler: null  # SB3 恒定 LR，故关闭
  # —— 训练起始 / 随机探索 —— #
  random_timesteps: 0
  learning_starts: 0
  # —— 损失相关 —— #
  ratio_clip: 0.2
  value_clip: 0.0                # SB3 clip_range_vf=None ⇒ 不剪裁
  clip_predicted_values: False
  entropy_loss_scale: 0.0        # SB3 ent_coef
  value_loss_scale: 0.5          # SB3 vf_coef
  grad_norm_clip: 0.5            # SB3 max_grad_norm
  kl_threshold: 0.0              # SB3 target_kl=None ⇒ 不早停
  # —— 其他 skrl‑特有的但在 SB3 中无对应项 —— #
  rewards_shaper_scale: 1.0      # 设为 1 以“等价于未启用”
  time_limit_bootstrap: False
  # —— 记录与检查点 —— #
  experiment:
    directory: "rl2path_direct"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: 10

# ───────────────────────────── Trainer ─────────────────────────────
trainer:
  class: SequentialTrainer
  timesteps: 350
  environment_info: log
# ------------------------------------------------------------------
